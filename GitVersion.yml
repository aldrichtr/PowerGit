# -------------------------------------------------------------------------------
# -- gitversion configuration file
# yaml-language-server: $schema="https://gitversion.net/schemas/7.0/GitVersion.configuration.json"
# -------------------------------------------------------------------------------

# Use a pre-configured template
# workflow # GitFlow/v1 , GitHubFlow/v1, TrunkBased/v1
calculation:
  mode: ContinuousDelivery
  semantic-version-format: Strict

  # SECTION Commit message processing
  # When enabled, gitversion respects `+semver: <scope>` entries in commit messages
  commit-message-incrementing: Enabled

  # To update the `{Major}` version,
  # add a git trailer style line to your commit message like:
  # +semver: major
  # major(v1.0)
  major-version-bump-message: >
    (^(breaking|major)
    (\(.*\))?:)
    |(\+semver:\s?
    (breaking|major))
    |BREAKING CHANGE(:)

  # Update the `{Minor}` version
  minor-version-bump-message: >
    (^(feat(ure)?|minor)
    (\(.*\))?:)
    |(\+semver:\s?
    (feat(ure)?|minor))

  # Update the `{Patch}` version
  patch-version-bump-message: >
    (^((bug)?fix|patch|perf|refactor)
    (\(.*\))?:)
    |(\+semver:\s?
    ((bug)?fix|patch))
  no-bump-message: \+semver:\s?(none|skip)

  # Regex that identifies merge commits
  merge-message-formats:
    github: >
      ^Merge pull request
      (?<PullRequestNumber>#\d+)
      from (?<Author>\w+):(?<SourceBranch>.+)

  # Branch names
  version-in-branch-pattern: (?<version>[vV]?\d+(\.\d+)?(\.\d+)?).*
  # !SECTION

  branches:
    main:
      increment: Patch
      is-main-branch: true
      is-release-branch: false
      is-source-branch-for: []
      label: ""
      prevent-increment:
        of-merged-branch: true
      regex: "^master$|^main$"
      source-branches: []
      track-merge-message: true
      track-merge-target: false
      tracks-release-branches: false
    release:
      increment: Minor
      is-main-branch: false
      is-release-branch: true
      is-source-branch-for: []
      label: beta
      mode: ManualDeployment
      prevent-increment:
        of-merged-branch: true
        when-current-commit-tagged: false
      regex: "^rel(ease)?[\/-](?<BranchName>.+)"
      source-branches:
        - main
      track-merge-target: false
      tracks-release-branches: false
    feature:
      increment: Inherit
      is-main-branch: false
      is-source-branch-for: []
      label: "{BranchName}"
      mode: ManualDeployment
      prevent-increment:
        when-current-commit-tagged: true
      regex: "^feat(ure)?[\/-](?<BranchName>.+)"
      source-branches:
        - main
        - release
      track-merge-message: true

  ignore:
    branches: []
    paths: []
    sha: []
    tags: []

  strategies:
    - Fallback
    - ConfiguredNextVersion
    - MergeMessage
    - TaggedCommit
    - TrackReleaseBranches
    - VersionInBranchName
  tag-prefix: "[vV]?"

  track-merge-message: true
  track-merge-target: false
  tracks-release-branches: false
  version-bump-reset-message: "=semver:"
output:
  assembly-file-versioning-scheme: MajorMinorPatch
  assembly-versioning-scheme: MajorMinorPatch
  branches:
    main:
      pre-release-weight: 55000
    release:
      pre-release-weight: 30000
    feature:
      pre-release-weight: 30000
  commit-date-format: yyyy.MM.dd
  tag-pre-release-weight: 60000
  update-build-number: true
